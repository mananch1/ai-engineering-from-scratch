[project]
name = "00-setup-and-tooling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manan Chahal", email = "mananchahal01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
